# Каталог сокета tmux для канала сессий Atrice.
#
# Создаётся заранее и до старта службы: каталог общий для агентов и гостевой
# службы, и ни одна из сторон не создаёт его сама. Служба этого и не может —
# у неё ProtectSystem=strict, вся иерархия только для чтения, и mkdir
# отвечает EROFS. Именно так первый запрос до первого запуска tmux давал
# tmux-failed, а после обычного вызова tmux тот же запрос отвечал пустым
# списком: ответ зависел от того, кто первым создал каталог.
#
# Права узкие: писать в каталог может только пользователь agent, под которым
# работают и агенты, и служба. Остальным каталог закрыт.
d /run/atrice 0755 root root -
d /run/atrice/sessions 0770 agent agent -
